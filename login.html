<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — Zymomax Biotech</title>
  <meta name="description" content="Login or create your Zymomax account to manage orders and track deliveries.">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/styles.css">
  <!-- EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    .password-group { position:relative; }
    .toggle-pw { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; }
    .social-login { display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
    .social-login-btn { display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; border-radius:10px; background:var(--glass-bg); border:1.5px solid var(--glass-border); color:var(--off-white); font-size:0.92rem; font-weight:600; cursor:pointer; transition:var(--transition); }
    .social-login-btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2); }
    .or-divider { display:flex; align-items:center; gap:16px; margin:20px 0; color:var(--muted); font-size:0.85rem; }
    .or-divider::before,.or-divider::after { content:''; flex:1; height:1px; background:var(--glass-border); }
    .strength-meter { height:4px; border-radius:2px; margin-top:8px; background:var(--glass-border); transition:var(--transition); }
    .strength-meter .bar { height:100%; border-radius:2px; transition:var(--transition); }
    .strength-weak .bar { width:33%; background:#ff6b6b; }
    .strength-medium .bar { width:66%; background:var(--gold); }
    .strength-strong .bar { width:100%; background:var(--teal); }
  </style>
</head>
<body>

<!-- Floating background orbs -->
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;">
  <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,201,177,0.08) 0%,transparent 70%);top:-100px;right:-100px;"></div>
  <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(79,172,222,0.06) 0%,transparent 70%);bottom:-80px;left:-80px;"></div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <img src="images/logo.jpg" alt="Zymomax" style="height:60px;border-radius:12px;">
    </div>
    <h1 class="auth-title">Welcome to Zymomax</h1>
    <p class="auth-sub">Your aquaculture solutions partner — login or create an account.</p>

    <!-- Tabs -->
    <div class="auth-tab">
      <button class="auth-tab-btn active" data-tab="login" id="tab-login">Login</button>
      <button class="auth-tab-btn" data-tab="register" id="tab-register">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="tab-content active" id="login-tab">
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span>*</span></label>
          <input class="form-input" id="login-email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password <span>*</span></label>
          <div class="password-group">
            <input class="form-input" id="login-password" type="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePw('login-password', this)">👁</button>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
          <a href="#" style="font-size:0.85rem;color:var(--teal);">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn">
          Login to Account →
        </button>
      </form>
      <div class="auth-footer" style="margin-top:20px;">
        New to Zymomax? <a href="#" onclick="switchTab('register')">Create an account</a>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div class="tab-content" id="register-tab">
      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-fname">First Name <span>*</span></label>
            <input class="form-input" id="reg-fname" type="text" placeholder="Ravi" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-lname">Last Name <span>*</span></label>
            <input class="form-input" id="reg-lname" type="text" placeholder="Kumar" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span>*</span></label>
          <input class="form-input" id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone Number <span>*</span></label>
          <input class="form-input" id="reg-phone" type="tel" placeholder="+91 98765 43210" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span>*</span></label>
          <div class="password-group">
            <input class="form-input" id="reg-password" type="password" placeholder="Min. 6 characters" required autocomplete="new-password" oninput="checkStrength(this.value)">
            <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)">👁</button>
          </div>
          <div class="strength-meter" id="strength-meter"><div class="bar"></div></div>
          <div id="strength-label" style="font-size:0.75rem;color:var(--muted);margin-top:4px;"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password <span>*</span></label>
          <div class="password-group">
            <input class="form-input" id="reg-confirm" type="password" placeholder="Repeat password" required autocomplete="new-password">
            <button type="button" class="toggle-pw" onclick="togglePw('reg-confirm', this)">👁</button>
          </div>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" id="reg-terms" style="margin-top:3px;accent-color:var(--teal);width:16px;height:16px;flex-shrink:0;" required>
          <label for="reg-terms" style="font-size:0.85rem;color:var(--muted);cursor:pointer;">I agree to the <a href="#" style="color:var(--teal);">Terms of Service</a> and <a href="#" style="color:var(--teal);">Privacy Policy</a></label>
        </div>

        <!-- Hidden fields for auth.js compatibility -->
        <input type="hidden" id="reg-name">

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-submit-btn">
          Create Account →
        </button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="#" onclick="switchTab('login')">Login here</a>
      </div>
    </div>

    <div style="margin-top:24px;text-align:center;">
      <a href="index.html" style="font-size:0.82rem;color:var(--muted);">← Back to Home</a>
    </div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/emailjs-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById(tab + '-tab').classList.add('active');
}
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}
function checkStrength(pw) {
  const meter = document.getElementById('strength-meter');
  const label = document.getElementById('strength-label');
  if (!meter) return;
  meter.className = 'strength-meter';
  if (pw.length === 0) { label.textContent = ''; return; }
  if (pw.length < 6) { meter.classList.add('strength-weak'); label.textContent = 'Weak'; label.style.color = '#ff6b6b'; }
  else if (pw.length < 10 || !/[A-Z]/.test(pw) || !/[0-9]/.test(pw)) { meter.classList.add('strength-medium'); label.textContent = 'Medium'; label.style.color = 'var(--gold)'; }
  else { meter.classList.add('strength-strong'); label.textContent = 'Strong ✓'; label.style.color = 'var(--teal)'; }
}
// Patch register form to combine first/last name
const regForm = document.getElementById('register-form');
if (regForm) {
  regForm.addEventListener('submit', function(e) {
    const fname = document.getElementById('reg-fname').value.trim();
    const lname = document.getElementById('reg-lname').value.trim();
    document.getElementById('reg-name').value = fname + ' ' + lname;
    // Also sync email/phone to expected IDs
    // (auth.js uses reg-name, reg-email, reg-phone, reg-password, reg-confirm)
  }, false);
}
// Override reg-name combine before auth.js handler runs
document.getElementById('register-form')?.addEventListener('submit', function() {
  const fn = document.getElementById('reg-fname').value.trim();
  const ln = document.getElementById('reg-lname').value.trim();
  document.getElementById('reg-name').value = (fn + ' ' + ln).trim();
}, true);
</script>
</body>
</html>
